# Contatto Configuration
# proxy listening address
addr = "127.0.0.1:9527"

# copy queue size for async image sync
copy_queue_size = 10

# default path template for all sources
# available variables: {{.Project}}, {{.Repo}}, {{.Tag}}
default_path_tpl = "{{.Registry}}_{{.Project}}/{{.Repo}}:{{.Tag}}"

# default proxy for all source registries (http://host:port or socks5h://host:port)
# can be overridden per source
default_source_proxy = "${HTTP_PROXY}"

# mirror registry: the destination where images are cached/stored
[mirror]
registry = "${MIRROR_REGISTRY}"
insecure = false
# auth: inline credentials
user = "${MIRROR_USER}"
password = "${MIRROR_PASSWORD}"

# source registries: each entry defines how a source registry maps to mirror
# key = source registry hostname
# path_tpl overrides default_path_tpl for this source
[source."docker.io"]
[source."gcr.io"]
[source."registry.k8s.io"]
[source."quay.io"]
[source."ghcr.io"]
[source."nvcr.io"]

### source with custom auth (e.g. private registry)
# [source."registry.example.com"]
# path_tpl = "private/{{.Project}}/{{.Repo}}:{{.Tag}}"
# user = "pull-user"
# password = "pull-pass"
# insecure = true
