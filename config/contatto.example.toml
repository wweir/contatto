# Contatto Configuration with Version Checking
addr = ":9527"
docker_config_file = "/root/.docker/config.json"

# Version checking configuration (optional)
[version_check]
enabled = true       # Enable version consistency checking for latest tags
max_queue_size = 100 # Maximum update queue size

# Base rule for mirror path template
[base_rule]
mirror_registry = "mirror"
on_missing_tpl = """
echo "Updating image: {{.raw}} -> {{.mirror}}"
# Add your sync command here, e.g.:
# skopeo copy docker://{{.raw}} docker://{{.mirror}}
"""

[registry."mirror.example.com"]
alias = "mirror"
insecure = false
user = ""
password = ""

# Registry configurations
[registry.docker.io]
path_tpl = "docker-hub/{{.Project}}/{{.Repo}}:{{.Tag}}"

[registry."gcr.io"]
path_tpl = "gcr/{{.Project}}/{{.Repo}}:{{.Tag}}"

[registry."k8s.gcr.io"]
path_tpl = "k8s-gcr/{{.Project}}/{{.Repo}}:{{.Tag}}"

[rule."registry.k8s.io"]
path_tpl = "k8s-gcr/{{.Project}}/{{.Repo}}:{{.Tag}}"

[registry."quay.io"]
path_tpl = "quay/{{.Project}}/{{.Repo}}:{{.Tag}}"

[registry."ghcr.io"]
path_tpl = "ghcr/{{.Project}}/{{.Repo}}:{{.Tag}}"

[rule."nvcr.io"]
path_tpl = "nvcr/{{.Project}}/{{.Repo}}:{{.Tag}}"
